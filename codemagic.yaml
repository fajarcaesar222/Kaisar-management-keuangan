workflows:
  kaisar-android-apk:
    name: Kaisar Management Keuangan - Android APK
    max_build_duration: 60
    instance_type: linux
    environment:
      flutter: stable
    scripts:
      - name: Extract Flutter project
        script: unzip -q kaisar_source.zip -d app
      - name: Install dependencies
        script: cd app && flutter pub get
      - name: Build installable Android APK
        script: cd app && flutter build apk --debug --android-skip-build-dependency-validation
    artifacts:
      - app/build/app/outputs/flutter-apk/*.apk
